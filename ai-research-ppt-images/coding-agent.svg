<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="AI coding agent 示意图">
  <defs>
    <linearGradient id="term" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0f172a" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="#f8fafc"/>
  <rect x="120" y="100" width="1360" height="800" rx="28" fill="#fff" stroke="#dbe2ee" filter="url(#shadow)"/>
  <text x="170" y="184" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" fill="#0f172a">代码复现工作台</text>
  <text x="170" y="232" font-family="Inter, Arial, sans-serif" font-size="22" fill="#475569">AI 负责读、改、跑；你负责确认边界和结果</text>

  <rect x="170" y="300" width="370" height="530" rx="24" fill="#f8fafc" stroke="#dbe2ee"/>
  <text x="200" y="352" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#0f172a">Repo 结构</text>
  <rect x="200" y="390" width="300" height="48" rx="14" fill="#dbeafe"/>
  <text x="224" y="421" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#1d4ed8">src / models / train.py</text>
  <rect x="200" y="452" width="300" height="48" rx="14" fill="#ede9fe"/>
  <text x="224" y="483" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#6d28d9">configs / datasets / eval</text>
  <rect x="200" y="514" width="300" height="48" rx="14" fill="#dcfce7"/>
  <text x="224" y="545" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#15803d">scripts / notebooks / logs</text>
  <rect x="200" y="608" width="300" height="176" rx="18" fill="#111827"/>
  <text x="224" y="648" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#e5e7eb">1. 先解释入口脚本</text>
  <text x="224" y="688" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#e5e7eb">2. 再跑最小 demo</text>
  <text x="224" y="728" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#e5e7eb">3. 最后才改实验</text>
  <text x="224" y="768" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#e5e7eb">4. 所有改动都留 diff</text>

  <rect x="610" y="300" width="400" height="530" rx="24" fill="url(#term)" stroke="#334155"/>
  <rect x="610" y="300" width="400" height="48" rx="24" fill="#1f2937"/>
  <circle cx="648" cy="324" r="8" fill="#ef4444"/>
  <circle cx="676" cy="324" r="8" fill="#f59e0b"/>
  <circle cx="704" cy="324" r="8" fill="#22c55e"/>
  <text x="742" y="330" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#cbd5e1">claude / codex / kimi code</text>
  <text x="642" y="398" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#22c55e">> 读取 train.py</text>
  <text x="642" y="440" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#e5e7eb">- 发现数据预处理入口</text>
  <text x="642" y="482" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#e5e7eb">- 发现损失函数定义</text>
  <text x="642" y="524" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#e5e7eb">- 发现评测脚本</text>
  <text x="642" y="594" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#60a5fa">> 修复依赖 / 运行 baseline</text>
  <text x="642" y="636" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#cbd5e1">✓ dataset ok</text>
  <text x="642" y="678" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#cbd5e1">✓ seed fixed</text>
  <text x="642" y="720" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#cbd5e1">✓ log saved</text>
  <text x="642" y="776" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#fbbf24">> 回到你：是否继续改模型？</text>

  <rect x="1050" y="300" width="330" height="530" rx="24" fill="#f8fafc" stroke="#dbe2ee"/>
  <text x="1086" y="352" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#0f172a">AI 提问清单</text>
  <g>
    <rect x="1086" y="388" width="250" height="56" rx="16" fill="#dbeafe"/>
    <text x="1108" y="423" font-family="Inter, Arial, sans-serif" font-size="20" fill="#1d4ed8">入口脚本在哪里？</text>
    <rect x="1086" y="458" width="250" height="56" rx="16" fill="#ede9fe"/>
    <text x="1108" y="493" font-family="Inter, Arial, sans-serif" font-size="20" fill="#6d28d9">最小复现命令是什么？</text>
    <rect x="1086" y="528" width="250" height="56" rx="16" fill="#dcfce7"/>
    <text x="1108" y="563" font-family="Inter, Arial, sans-serif" font-size="20" fill="#15803d">哪些参数会影响结果？</text>
    <rect x="1086" y="598" width="250" height="56" rx="16" fill="#fee2e2"/>
    <text x="1108" y="633" font-family="Inter, Arial, sans-serif" font-size="20" fill="#b91c1c">哪里最容易出错？</text>
  </g>
</svg>
