<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="rebuttal 时间线示意图">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="#f8fafc"/>
  <rect x="110" y="100" width="1380" height="800" rx="28" fill="#fff" stroke="#dbe2ee" filter="url(#shadow)"/>
  <text x="160" y="184" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" fill="#0f172a">7 天 rebuttal</text>
  <text x="160" y="232" font-family="Inter, Arial, sans-serif" font-size="22" fill="#475569">先理解 reviewer 的意图，再选择补实验或澄清</text>

  <line x1="180" y1="410" x2="1420" y2="410" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
  <g>
    <circle cx="220" cy="410" r="18" fill="#2563eb"/>
    <rect x="160" y="450" width="120" height="116" rx="18" fill="#dbeafe"/>
    <text x="195" y="492" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#1d4ed8">D1</text>
    <text x="180" y="526" font-family="Inter, Arial, sans-serif" font-size="18" fill="#1e3a8a">拆 review</text>
  </g>
  <g>
    <circle cx="430" cy="410" r="18" fill="#7c3aed"/>
    <rect x="370" y="290" width="120" height="116" rx="18" fill="#ede9fe"/>
    <text x="405" y="332" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#6d28d9">D2</text>
    <text x="386" y="366" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5b21b6">分组问题</text>
  </g>
  <g>
    <circle cx="640" cy="410" r="18" fill="#22c55e"/>
    <rect x="580" y="450" width="120" height="116" rx="18" fill="#dcfce7"/>
    <text x="614" y="492" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#15803d">D3</text>
    <text x="596" y="526" font-family="Inter, Arial, sans-serif" font-size="18" fill="#166534">补证据</text>
  </g>
  <g>
    <circle cx="850" cy="410" r="18" fill="#f59e0b"/>
    <rect x="790" y="290" width="120" height="116" rx="18" fill="#fef3c7"/>
    <text x="824" y="332" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#b45309">D4</text>
    <text x="806" y="366" font-family="Inter, Arial, sans-serif" font-size="18" fill="#92400e">写回应</text>
  </g>
  <g>
    <circle cx="1060" cy="410" r="18" fill="#ef4444"/>
    <rect x="1000" y="450" width="120" height="116" rx="18" fill="#fee2e2"/>
    <text x="1034" y="492" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#b91c1c">D5</text>
    <text x="1016" y="526" font-family="Inter, Arial, sans-serif" font-size="18" fill="#7f1d1d">核对语气</text>
  </g>
  <g>
    <circle cx="1270" cy="410" r="18" fill="#0ea5e9"/>
    <rect x="1210" y="290" width="120" height="116" rx="18" fill="#e0f2fe"/>
    <text x="1244" y="332" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#0284c7">D6</text>
    <text x="1224" y="366" font-family="Inter, Arial, sans-serif" font-size="18" fill="#075985">交叉审阅</text>
  </g>
  <g>
    <circle cx="1410" cy="410" r="18" fill="#111827"/>
    <rect x="1350" y="450" width="120" height="116" rx="18" fill="#111827"/>
    <text x="1384" y="492" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#fff">D7</text>
    <text x="1366" y="526" font-family="Inter, Arial, sans-serif" font-size="18" fill="#e5e7eb">提交</text>
  </g>

  <rect x="190" y="650" width="520" height="160" rx="22" fill="#111827"/>
  <text x="220" y="708" font-family="JetBrains Mono, Consolas, monospace" font-size="20" fill="#e5e7eb">不要先回击 reviewer</text>
  <text x="220" y="748" font-family="JetBrains Mono, Consolas, monospace" font-size="20" fill="#e5e7eb">先判断：误解 / 合理质疑 / 事实错误</text>
  <text x="220" y="788" font-family="JetBrains Mono, Consolas, monospace" font-size="20" fill="#e5e7eb">目标是降低不确定性，不是争输赢</text>
</svg>
