<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="论文写作流程示意图">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="#f8fafc"/>
  <rect x="110" y="100" width="1380" height="800" rx="28" fill="#fff" stroke="#dbe2ee" filter="url(#shadow)"/>
  <text x="160" y="184" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" fill="#0f172a">写作流程</text>
  <text x="160" y="232" font-family="Inter, Arial, sans-serif" font-size="26" fill="#475569">AI 用来润色、梳理框架、挑刺；结论和 claim 仍由你负责</text>

  <rect x="170" y="300" width="330" height="500" rx="24" fill="#f8fafc" stroke="#dbe2ee"/>
  <text x="206" y="352" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#0f172a">文章骨架</text>
  <rect x="206" y="388" width="240" height="52" rx="14" fill="#dbeafe"/>
  <text x="230" y="422" font-family="Inter, Arial, sans-serif" font-size="23" fill="#1d4ed8">Introduction</text>
  <rect x="206" y="454" width="240" height="52" rx="14" fill="#ede9fe"/>
  <text x="230" y="488" font-family="Inter, Arial, sans-serif" font-size="23" fill="#6d28d9">Method</text>
  <rect x="206" y="520" width="240" height="52" rx="14" fill="#dcfce7"/>
  <text x="230" y="554" font-family="Inter, Arial, sans-serif" font-size="23" fill="#15803d">Experiments</text>
  <rect x="206" y="586" width="240" height="52" rx="14" fill="#fee2e2"/>
  <text x="230" y="620" font-family="Inter, Arial, sans-serif" font-size="23" fill="#b91c1c">Limitations</text>
  <rect x="206" y="686" width="240" height="90" rx="16" fill="#111827"/>
  <text x="230" y="724" font-family="JetBrains Mono, Consolas, monospace" font-size="21" fill="#e5e7eb">AI 帮你：</text>
  <text x="230" y="756" font-family="JetBrains Mono, Consolas, monospace" font-size="21" fill="#e5e7eb">重排、润色、挑刺</text>

  <rect x="560" y="300" width="500" height="500" rx="24" fill="#f8fafc" stroke="#dbe2ee"/>
  <text x="596" y="352" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#0f172a">track changes 示例</text>
  <rect x="596" y="388" width="420" height="56" rx="12" fill="#fff" stroke="#dbe2ee"/>
  <text x="620" y="424" font-family="Inter, Arial, sans-serif" font-size="22" fill="#475569">This paper proposes a new framework...</text>
  <rect x="596" y="468" width="420" height="56" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="620" y="504" font-family="Inter, Arial, sans-serif" font-size="22" fill="#c2410c">AI: 这里要补一个和 baseline 的对比。</text>
  <rect x="596" y="548" width="420" height="56" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="620" y="584" font-family="Inter, Arial, sans-serif" font-size="22" fill="#1d4ed8">AI: 这一句可以更短，更像口语。</text>
  <rect x="596" y="628" width="420" height="56" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <text x="620" y="664" font-family="Inter, Arial, sans-serif" font-size="22" fill="#15803d">Reviewer mode: 这个 claim 证据够吗？</text>
  <rect x="596" y="708" width="420" height="56" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="620" y="744" font-family="Inter, Arial, sans-serif" font-size="22" fill="#6d28d9">AI: 建议先写出失败案例。</text>

  <rect x="1080" y="300" width="360" height="500" rx="24" fill="#111827" stroke="#334155"/>
  <text x="1114" y="352" font-family="JetBrains Mono, Consolas, monospace" font-size="22" fill="#e5e7eb">写作时的 4 个问题</text>
  <text x="1114" y="414" font-family="JetBrains Mono, Consolas, monospace" font-size="21" fill="#60a5fa">1. 这段在证明什么？</text>
  <text x="1114" y="470" font-family="JetBrains Mono, Consolas, monospace" font-size="21" fill="#60a5fa">2. 证据够不够？</text>
  <text x="1114" y="526" font-family="JetBrains Mono, Consolas, monospace" font-size="21" fill="#60a5fa">3. reviewer 会卡哪里？</text>
  <text x="1114" y="582" font-family="JetBrains Mono, Consolas, monospace" font-size="21" fill="#60a5fa">4. 有没有更短的说法？</text>
  <rect x="1114" y="652" width="190" height="86" rx="18" fill="#f59e0b"/>
  <text x="1142" y="704" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#fff">先搭骨架</text>
</svg>
