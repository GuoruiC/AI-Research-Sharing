<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="AI论文搜索示意图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect x="100" y="90" width="1400" height="820" rx="28" fill="#ffffff" stroke="#dbe2ee" filter="url(#shadow)"/>
  <rect x="100" y="90" width="1400" height="86" rx="28" fill="#111827"/>
  <rect x="140" y="122" width="180" height="22" rx="11" fill="#1f2937"/>
  <rect x="340" y="120" width="760" height="26" rx="13" fill="#e5e7eb"/>
  <rect x="360" y="126" width="320" height="14" rx="7" fill="#9ca3af"/>
  <circle cx="1140" cy="133" r="11" fill="#22c55e"/>
  <circle cx="1180" cy="133" r="11" fill="#f59e0b"/>
  <circle cx="1220" cy="133" r="11" fill="#ef4444"/>

  <rect x="150" y="240" width="340" height="610" rx="24" fill="#f8fafc" stroke="#dbe2ee"/>
  <text x="186" y="292" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">AI 查新面板</text>
  <text x="186" y="342" font-family="Inter, Arial, sans-serif" font-size="22" fill="#475569">关键词</text>
  <rect x="186" y="360" width="260" height="54" rx="14" fill="#fff" stroke="#cbd5e1"/>
  <text x="210" y="395" font-family="Inter, Arial, sans-serif" font-size="20" fill="#2563eb">LLM + 论文阅读 + 复现</text>
  <text x="186" y="470" font-family="Inter, Arial, sans-serif" font-size="22" fill="#475569">筛选条件</text>
  <rect x="186" y="488" width="128" height="40" rx="20" fill="#dbeafe"/>
  <text x="214" y="514" font-family="Inter, Arial, sans-serif" font-size="18" fill="#1d4ed8">近 12 个月</text>
  <rect x="320" y="488" width="126" height="40" rx="20" fill="#ede9fe"/>
  <text x="350" y="514" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6d28d9">顶会优先</text>
  <text x="186" y="585" font-family="Inter, Arial, sans-serif" font-size="22" fill="#475569">AI 输出</text>
  <rect x="186" y="604" width="260" height="160" rx="18" fill="#111827"/>
  <text x="212" y="650" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#e5e7eb">1. 找相近论文</text>
  <text x="212" y="690" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#e5e7eb">2. 列出差异表</text>
  <text x="212" y="730" font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#e5e7eb">3. 标出可抢时间窗</text>

  <text x="550" y="292" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">论文结果页</text>
  <g transform="translate(540 330)">
    <rect width="920" height="130" rx="20" fill="#fff" stroke="#dbe2ee"/>
    <rect x="28" y="30" width="72" height="72" rx="18" fill="#dbeafe"/>
