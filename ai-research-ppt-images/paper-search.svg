    <text x="128" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">How to Read 200 Papers with AI</text>
    <text x="128" y="96" font-family="Inter, Arial, sans-serif" font-size="20" fill="#475569">摘要 · 方法 · 复现脚本 · 阅读卡</text>
    <rect x="748" y="38" width="144" height="44" rx="22" fill="url(#accent)"/>
    <text x="788" y="68" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff">已读</text>
  </g>
  <g transform="translate(540 490)">
    <rect width="920" height="130" rx="20" fill="#fff" stroke="#dbe2ee"/>
    <rect x="28" y="30" width="72" height="72" rx="18" fill="#ede9fe"/>
    <text x="50" y="76" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#6d28d9">02</text>
    <text x="128" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Search-then-Read for Research Ideas</text>
    <text x="128" y="96" font-family="Inter, Arial, sans-serif" font-size="20" fill="#475569">查新 · 选题边界 · 相关工作地图</text>
    <rect x="726" y="38" width="166" height="44" rx="22" fill="#f59e0b"/>
    <text x="770" y="68" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff">相似</text>
  </g>
  <g transform="translate(540 650)">
    <rect width="920" height="130" rx="20" fill="#fff" stroke="#dbe2ee"/>
    <rect x="28" y="30" width="72" height="72" rx="18" fill="#dcfce7"/>
    <text x="50" y="76" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#15803d">03</text>
    <text x="128" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Reproducible Baseline Checklist</text>
    <text x="128" y="96" font-family="Inter, Arial, sans-serif" font-size="20" fill="#475569">环境 · 数据 · 指标 · seed · 日志</text>
    <rect x="714" y="38" width="178" height="44" rx="22" fill="#22c55e"/>
    <text x="758" y="68" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#fff">可复现</text>
  </g>
