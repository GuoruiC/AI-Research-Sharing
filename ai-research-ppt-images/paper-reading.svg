<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="论文阅读分层示意图">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="#f8fafc"/>
  <rect x="110" y="110" width="1380" height="780" rx="28" fill="#fff" stroke="#dbe2ee" filter="url(#shadow)"/>
  <text x="160" y="190" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" fill="#0f172a">分层读论文</text>
  <text x="160" y="236" font-family="Inter, Arial, sans-serif" font-size="22" fill="#475569">先判断值不值得读，再决定读多深</text>

  <g transform="translate(150 290)">
    <rect width="520" height="520" rx="26" fill="url(#paper)" stroke="#cbd5e1"/>
    <rect x="48" y="46" width="220" height="20" rx="10" fill="#dbeafe"/>
    <rect x="48" y="84" width="400" height="20" rx="10" fill="#e2e8f0"/>
    <rect x="48" y="126" width="390" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="48" y="150" width="330" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="48" y="196" width="420" height="150" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="72" y="240" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#1d4ed8">问题</text>
    <text x="72" y="278" font-family="Inter, Arial, sans-serif" font-size="20" fill="#1e3a8a">这篇工作在解决什么痛点？</text>
    <text x="72" y="314" font-family="Inter, Arial, sans-serif" font-size="20" fill="#1e3a8a">适不适合你的场景？</text>
    <rect x="48" y="372" width="420" height="100" rx="18" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="72" y="415" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#6d28d9">AI 读图笔记</text>
    <text x="72" y="448" font-family="Inter, Arial, sans-serif" font-size="19" fill="#5b21b6">摘要提炼 · 图表解释 · 术语翻译</text>
  </g>

  <g transform="translate(740 290)">
    <rect width="700" height="180" rx="24" fill="#fff" stroke="#dbe2ee"/>
    <text x="34" y="56" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#0f172a">Pass 1 · 5 分钟</text>
    <text x="34" y="98" font-family="Inter, Arial, sans-serif" font-size="22" fill="#475569">标题 / 摘要 / 图表 / 结论</text>
    <rect x="514" y="42" width="154" height="88" rx="18" fill="#dcfce7" stroke="#86efac"/>
    <text x="549" y="94" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#166534">决定</text>
  </g>
  <g transform="translate(740 494)">
    <rect width="700" height="180" rx="24" fill="#fff" stroke="#dbe2ee"/>
    <text x="34" y="56" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#0f172a">Pass 2 · 15 分钟</text>
    <text x="34" y="98" font-family="Inter, Arial, sans-serif" font-size="22" fill="#475569">引言 / 方法 / 实验 / 对照组</text>
    <rect x="514" y="42" width="154" height="88" rx="18" fill="#dcfce7" stroke="#86efac"/>
    <text x="549" y="94" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#166534">理解</text>
  </g>
  <g transform="translate(740 698)">
    <rect width="700" height="110" rx="24" fill="#fff" stroke="#dbe2ee"/>
    <text x="34" y="68" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#0f172a">Pass 3-4 · 复现与批判</text>
    <rect x="514" y="30" width="154" height="52" rx="16" fill="#dcfce7" stroke="#86efac"/>
    <text x="564" y="65" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#166534">输出</text>
  </g>
</svg>
